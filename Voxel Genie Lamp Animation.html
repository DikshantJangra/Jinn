<style>
/* Layout: full-bleed voxel stage; header top-left, floating control dock bottom-center. */
:root{
  --bg0:#070b14; --bg1:#132545; --fg:#e8eff7; --muted:#8ea3bd;
  --accent:#36c1ff; --gold:#ffc24a;
  --panel:rgba(14,22,38,.66); --panel-brd:rgba(255,255,255,.10); --panel-hi:rgba(255,255,255,.05);
  --font-d:"Fredoka",system-ui,sans-serif; --font-m:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --bg0:#e7edf4; --bg1:#fbfdff; --fg:#16202e; --muted:#5a6b82;
  --accent:#0d8fd6; --gold:#c47e10;
  --panel:rgba(255,255,255,.74); --panel-brd:rgba(12,24,46,.12); --panel-hi:rgba(255,255,255,.6);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg0:#e7edf4; --bg1:#fbfdff; --fg:#16202e; --muted:#5a6b82;
  --accent:#0d8fd6; --gold:#c47e10;
  --panel:rgba(255,255,255,.74); --panel-brd:rgba(12,24,46,.12); --panel-hi:rgba(255,255,255,.6);
  color-scheme:light;
}

html,body{height:100%}
body{
  background:
    radial-gradient(130% 100% at 50% 40%, var(--bg1) 0%, var(--bg0) 62%);
  color:var(--fg); overflow:hidden; font-family:var(--font-m);
  -webkit-font-smoothing:antialiased;
}
.wrap{position:relative;height:100%;width:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}

/* header */
.head{
  position:absolute;top:0;left:0;z-index:5;
  padding-top:max(18px,env(safe-area-inset-top,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));
  pointer-events:none;
}
.eyebrow{
  font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  font-weight:500;margin:0 0 .25em;opacity:.9;
}
.title{
  font-family:var(--font-d);font-weight:600;line-height:1;margin:0;
  font-size:clamp(1.45rem,4.6vw,2.3rem);letter-spacing:-.01em;
  text-wrap:balance;
  text-shadow:0 2px 18px rgba(0,0,0,.35);
}
.title .amp{color:var(--gold)}

/* dock */
.dock{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:max(16px,env(safe-area-inset-bottom,0px));
  z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  max-width:min(94vw,560px);
  padding:8px;border-radius:16px;
  background:var(--panel);border:1px solid var(--panel-brd);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 var(--panel-hi);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
}
.btn{
  appearance:none;border:1px solid var(--panel-brd);background:transparent;color:var(--fg);
  font-family:var(--font-m);font-size:.74rem;font-weight:500;
  height:38px;padding:0 13px;border-radius:11px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:var(--panel-hi);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent);color:var(--fg)}
.btn svg{width:15px;height:15px;flex:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.speed{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--panel-brd)}
.speed label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:92px;height:4px;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent)) no-repeat,color-mix(in srgb,var(--fg) 20%,transparent);
  background-size:var(--fill,50%) 100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--fg);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:2px solid var(--accent)}

.hint{
  position:absolute;right:max(16px,env(safe-area-inset-right,0px));
  bottom:max(18px,env(safe-area-inset-bottom,0px));
  z-index:5;font-size:.62rem;color:var(--muted);letter-spacing:.04em;
  pointer-events:none;text-align:right;line-height:1.5;opacity:.8;
}
@media (max-width:560px){ .hint{display:none} .title{font-size:1.5rem} }
.sep{width:1px;height:22px;background:var(--panel-brd);margin:0 2px}
</style>

function sprite(hex, size, pos){
  const sp=new T.Sprite(new T.SpriteMaterial({map:glowTex(hex), blending:T.AdditiveBlending, transparent:true, depthWrite:false, depthTest:true, opacity:0.9}));
  sp.scale.set(size,size,1); sp.position.set(pos[0],pos[1],pos[2]); pivot.add(sp); return sp;
}
const gEyeL = sprite(0xBDF2FF, 4.2, [4.5,32.2,4]);
const gEyeR = sprite(0xBDF2FF, 4.2, [7.5,32.2,4]);
const gGem  = sprite(0xFFA030, 5.0, [6,34.6,5]);
const gAmb  = sprite(0x2aa0ff, 34, [5,27,-2]); gAmb.material.opacity=0.16;
const glowSprites=[gEyeL,gEyeR,gGem];

// ---- ground contact shadow -------------------------------------------------
const groundY = (mny - cen.y) - 0.2;
const ground = new T.Mesh(new T.PlaneGeometry(120,120), new T.ShadowMaterial({opacity:0.34}));
ground.rotation.x = -Math.PI/2; ground.position.y = groundY; ground.receiveShadow = true;
scene.add(ground);

// ---- interaction -----------------------------------------------------------
let rotY=0, rotX=0, targY=0, targX=0;
let dragging=false, lastX=0, lastY=0;
const pointers=new Map(); let pinchD=0;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.classList.add('drag');}
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){
    const p=[...pointers.values()]; const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD){ zoom=Math.max(0.55,Math.min(2.4, zoom*(d/pinchD))); fit(); }
    pinchD=d; dragging=false; return;
  }
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    targY += dx*0.0095;
    targX = Math.max(-0.55, Math.min(0.62, targX + dy*0.007));
  }
});
function up(e){ pointers.delete(e.pointerId); if(pointers.size<2)pinchD=0; if(pointers.size===0){dragging=false;canvas.classList.remove('drag');} }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(0.55,Math.min(2.4, zoom*(e.deltaY<0?1.08:0.925))); fit(); }, {passive:false});

// ---- controls --------------------------------------------------------------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing = !reduce, spinning = false, speed = 1;
const $play=document.getElementById('play'), $playlbl=document.getElementById('playlbl'),
      $playicon=document.getElementById('playicon'), $spin=document.getElementById('spin'),
      $reset=document.getElementById('reset'), $spd=document.getElementById('spd');
const ICON_PLAY='<path d="M8 5v14l11-7z"/>', ICON_PAUSE='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
function syncPlay(){ $play.setAttribute('aria-pressed',playing); $playlbl.textContent=playing?'Pause':'Play'; $playicon.innerHTML=playing?ICON_PAUSE:ICON_PLAY; }
$play.onclick=()=>{playing=!playing; syncPlay();};
$spin.onclick=()=>{spinning=!spinning; $spin.setAttribute('aria-pressed',spinning);};
$reset.onclick=()=>{ targY=0; targX=0; zoom=1; fit(); };
function sliderFill(){ $spd.style.setProperty('--fill',(($spd.value-$spd.min)/($spd.max-$spd.min)*100)+'%'); }
$spd.oninput=()=>{ speed=$spd.value/100; sliderFill(); };
syncPlay(); sliderFill();
if(reduce) syncPlay();

// ---- animation -------------------------------------------------------------
const mtmp=new T.Matrix4(), qtmp=new T.Quaternion(), ptmp=new T.Vector3(), stmp=new T.Vector3(1,1,1);
const TAU=Math.PI*2;
let tsec=0, last=performance.now();

function updateAnimated(ph, amp){
  const bob = Math.sin(ph)*1.1*amp;
  for(const rec of meshes){
    if(!rec.animated) continue;
    const it=rec.items, m=rec.mesh;
    for(let i=0;i<it.length;i++){
      const v=it[i], grp=GRP[v[4]], t=v[5];
      let ox=0,oy=0,oz=0,ry=0;
      if(grp==='genie'||grp==='eye'||grp==='gem'){ oy=bob; }
      else if(grp==='tail'){ oy=bob*t; ox=Math.sin(ph+t*6)*0.9*t*amp; oz=Math.cos(ph+t*6)*0.9*t*amp; }
      else if(grp==='float'){ oy=Math.sin(ph+t*TAU)*1.8*amp+bob*0.5; ox=Math.cos(ph*0.8+t*TAU)*1.2*amp; ry=ph*0.6+t*9; }
      ptmp.set(v[0]+ox, v[1]+oy, v[2]+oz);
      if(ry){ qtmp.setFromAxisAngle(YAXIS,ry); } else qtmp.identity();
      mtmp.compose(ptmp,qtmp,stmp);
      m.setMatrixAt(i,mtmp);
    }
    m.instanceMatrix.needsUpdate=true;
  }
  // emissive + glow pulse
  const pulse = 0.5+0.5*Math.sin(ph*1.25);
  mat.eye.emissiveIntensity = 1.3 + 0.9*pulse;
  mat.gem.emissiveIntensity = 1.1 + 0.8*pulse;
  eyeLight.intensity = 0.9 + 0.9*pulse;
  gemLight.intensity = 0.7 + 0.7*pulse;
  const glint = 0.8 + 0.3*Math.sin(ph*0.9) + 0.25*Math.max(0,Math.sin(ph*0.37)**8);
  mat.gold_glow.emissiveIntensity = glint;
  for(const sp of glowSprites){ const b=0.7+0.5*pulse; sp.material.opacity=b; }
}

// static pose for reduced-motion / paused first frame
function poseStatic(){ updateAnimated(0, reduce?0:0); }
poseStatic();
fit();

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){ tsec += dt*speed; }
  if(spinning){ targY += dt*0.45; }
  rotY += (targY-rotY)*0.12; rotX += (targX-rotX)*0.12;
  pivot.rotation.y = rotY; pivot.rotation.x = rotX;
  const ph = tsec*TAU*0.5;            // full loop ~ 4s at speed 1
  updateAnimated(ph, (playing?1:0));
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize',fit);
// theme flips don't need JS; CSS tokens handle it.
})();
</script>
</body></html>
