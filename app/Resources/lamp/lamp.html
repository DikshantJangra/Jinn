  downAt = null;
});

const mtmp=new T.Matrix4(), qtmp=new T.Quaternion(), ptmp=new T.Vector3(), stmp=new T.Vector3(1,1,1);
const TAU=Math.PI*2;
let tsec=0, last=performance.now();

function updateAnimated(ph, amp){
  const bob = Math.sin(ph)*1.1*amp*(1+think*0.6);
  for(const rec of meshes){
    if(!rec.animated) continue;
    const it=rec.items, m=rec.mesh;
    for(let i=0;i<it.length;i++){
      const v=it[i], grp=GRP[v[4]], t=v[5];
      let ox=0,oy=0,oz=0,ry=0;
      if(grp==='genie'||grp==='eye'||grp==='gem'){ oy=bob; }
      else if(grp==='tail'){ oy=bob*t; ox=Math.sin(ph+t*6)*0.9*t*amp; oz=Math.cos(ph+t*6)*0.9*t*amp; }
      else if(grp==='float'){ const dx=v[0]-5, dz=v[2]-0.5, a=Math.atan2(dz,dx)+orbit*(0.8+t*0.7), rr=Math.hypot(dx,dz)*(1+think*0.45);
        oy=Math.sin(ph+t*TAU)*1.8*amp*(1+think)+bob*0.5;
        ox=Math.cos(a)*rr-dx+Math.cos(ph*0.8+t*TAU)*1.2*amp; oz=Math.sin(a)*rr-dz; ry=ph*0.6+t*9+orbit*2; }
      const g = grow(rec,i);
      ptmp.set(v[0]+ox, v[1]+oy-(1-g)*2, v[2]+oz);
      if(ry){ qtmp.setFromAxisAngle(YAXIS,ry); } else qtmp.identity();
      stmp.setScalar(Math.max(0,g));
      mtmp.compose(ptmp,qtmp,stmp);
      m.setMatrixAt(i,mtmp);
    }
    m.instanceMatrix.needsUpdate=true;
  }
  const pulse = 0.5+0.5*Math.sin(ph*(1.25+think*1.5));
  mat.eye.emissiveIntensity = 1.3 + 0.9*pulse;
  mat.gem.emissiveIntensity = 1.1 + 0.8*pulse;
  const gk = glowK();
  eyeLight.intensity = (0.9 + 0.9*pulse)*gk;
  gemLight.intensity = (0.7 + 0.7*pulse)*gk;
  const glint = 0.8 + 0.3*Math.sin(ph*0.9) + 0.25*Math.max(0,Math.sin(ph*0.37)**8);
  mat.gold_glow.emissiveIntensity = glint + think*0.9;
  mat.gold.emissiveIntensity = 0.12 + 0.6*think + 0.08*pulse;
  mat.blue.emissiveIntensity = 0.4 + 0.55*think; mat.blue_light.emissiveIntensity = 0.35 + 0.6*think; mat.float.emissiveIntensity = 0.5 + 1.0*think;
  gLamp.material.opacity = (0.08 + 0.45*think + 0.08*pulse)*glowK();
  key.intensity = 1.05 + 0.55*think;
  for(const sp of glowSprites){ const b=0.7+0.5*pulse; sp.material.opacity=b*gk; }
  gAmb.material.opacity = 0.08*gk;
}

function poseStatic(){ updateAnimated(0, reduce?0:0); }
poseStatic();
fit();

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(building){ bt += dt; updateStatic(); if(bt >= BUILD_SEC){ building=false; updateStatic(); } }
  burst = Math.max(0, burst - dt*1.6);
  if(playing){ tsec += dt*(speed + burst*4); }
  if(spinning){ targY += dt*0.45; }
  think += ((swaying?1:0)-think)*0.08;
  orbit += dt*think*18;
  const sway = swaying ? Math.sin(tsec*2.4)*0.28 : 0;
  rotY += (targY+sway-rotY)*0.12; rotX += (targX-rotX)*0.12;
  pivot.rotation.y = rotY; pivot.rotation.x = rotX;
  const ph = tsec*TAU*0.5;
  updateAnimated(ph, (playing?1:0));
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize',fit);
})();
</script></body></html>
